<!doctype html>
<html lang="ca"><head><meta charset="utf-8">
<title>K Rooms · flujo de distribución (fuente de la animación)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Fuente de la animación de la card de K Rooms. Se renderiza a vídeo con scripts/render-k-rooms-flow.py.
   Duración 5 s, determinista: todo es función de t (?t=segundos). Lienzo 750×900 (5:6). */
:root{
  --bg:#f8fafc; --elev:#fff; --hl:#f1f5f9; --line:#e2e8f0; --mid:#cbd5e1; --strong:#94a3b8;
  --ink:#0f172a; --sub:#475569; --faint:#64748b;
  --acc:#2f7a5a; --acc-deep:#e7f1eb; --free:#e9f1ec; --taken:#dccdc3;
}
*{box-sizing:border-box;margin:0}
html,body{width:750px;height:900px;overflow:hidden}
body{font-family:Figtree,'Helvetica Neue',Arial,sans-serif;color:var(--ink);
  background:radial-gradient(120% 90% at 50% 38%,#efece5 0%,#e3dfd6 100%)}
.stage{position:relative;width:750px;height:900px}
.phone{position:absolute;left:50%;top:50%;width:394px;height:800px;margin:-400px 0 0 -197px;
  transform:scale(.87);border-radius:22px;
  box-shadow:0 0 0 1px rgba(40,34,20,.08),0 40px 80px -30px rgba(40,34,20,.35),0 14px 28px -14px rgba(40,34,20,.22)}
.screen{position:relative;width:100%;height:100%;border-radius:22px;background:var(--bg);overflow:hidden}
.ui{position:absolute;inset:-34px 0 0;padding:58px 22px 0}   /* sin barra de estado: todo sube 34 px */
.head{display:flex;align-items:center;gap:14px;height:44px}
.head h1{font-size:26px;font-weight:700;letter-spacing:-.01em}
.steps{display:flex;gap:5px;align-items:center}
.steps i{display:block;width:22px;height:5px;border-radius:3px;background:var(--track,#dbe3ea)}
.steps i.on{background:#9ec5b3}.steps i.cur{background:var(--acc)}
.steps b{font-weight:500;font-size:13px;color:var(--sub);margin-left:6px}
.x{margin-left:auto;width:24px;height:24px}
.sel{margin-top:12px;height:46px;border:1px solid var(--line);border-radius:14px;background:var(--elev);display:flex;align-items:center;
  padding:0 16px;font-weight:700;font-size:15px;justify-content:space-between}
.part{margin-top:18px;display:flex;align-items:center;justify-content:space-between}
.part h2{font-size:17px;font-weight:500}
.pill{background:#d6e9df;color:var(--acc);font-weight:700;font-size:14px;border-radius:999px;padding:5px 12px;min-width:92px;text-align:center}
.strip{position:relative;margin-top:12px;height:50px}
.chip{position:absolute;top:0;height:50px;border-radius:999px;border:1.5px solid var(--mid);background:var(--elev);
  display:flex;align-items:center;gap:12px;padding:0 14px;font-weight:700;font-size:15px;white-space:nowrap}
.chip svg{width:20px;height:20px;flex:none}
.chip .ck{margin-left:auto;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--acc);display:grid;place-items:center;opacity:0}
.chip .ck svg{width:16px;height:16px;stroke:var(--acc)}
.map{position:absolute;left:0;right:0;top:245px;height:440px}
.rm{position:absolute;border:2px solid var(--strong);background:var(--free);}
.dash{position:absolute;border:1.5px dashed var(--mid)}
.lbl{position:absolute;font-size:10px;font-weight:700;letter-spacing:.04em;color:#b4bfcc;text-transform:uppercase}
.tag{position:absolute;background:#fff;border:1px solid var(--mid);border-radius:9px;padding:5px 9px 4px;text-align:center;font-weight:500;font-size:13px;box-shadow:0 1px 2px rgba(15,23,42,.06)}
.tag b{display:flex;align-items:center;gap:6px;font-size:24px;line-height:1.05;font-weight:700;margin-top:1px;justify-content:center}
.tag b::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--acc)}
.hatch{background:repeating-linear-gradient(135deg,transparent 0 5px,#cdd5de 5px 6px);border:1.5px solid var(--strong)}
.zoom{position:absolute;right:0;top:285px;width:46px;height:122px;border-radius:23px;background:#fff;box-shadow:0 2px 10px rgba(15,23,42,.12);display:flex;flex-direction:column;align-items:center;justify-content:space-around}
.zoom svg{width:20px;height:20px}
.floor{position:absolute;left:22px;right:22px;top:694px;height:44px;display:flex;gap:10px}
.floor .f{flex:1;border:1px solid var(--line);border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:15px}
.floor .f small{font-weight:500;font-size:12px;color:var(--sub)}
.floor .i{width:46px;border:1px solid var(--line);border-radius:12px;background:#fff;display:grid;place-items:center}
.acts{position:absolute;left:22px;right:22px;bottom:22px;display:flex;gap:10px}
.btn{height:46px;border-radius:999px;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.b2{flex:0 0 112px;border:1.5px solid var(--mid);background:#fff}
.b1{flex:1;background:#d9e1e7;color:#8b99a8}
.b1 span{position:absolute;white-space:nowrap}
/* Aviso de éxito: CMP-012 «notice» de la app (tokens --ds-notice-success-*, --ds-shadow-notice, r-m, sp-3).
   Como en la app, flota a 12 px de los bordes y por encima de la barra de planta. */
.notice{position:absolute;left:12px;right:12px;bottom:152px;display:flex;align-items:center;gap:12px;padding:12px;border:1px solid color-mix(in srgb,var(--acc) 65%,#fff);border-radius:12px;background:color-mix(in srgb,var(--acc) 10%,#fff);color:var(--ink);font-size:16px;font-weight:500;line-height:1.45;box-shadow:0 6px 24px rgba(15,23,42,.16);z-index:25;opacity:0}
.notice-icon{flex:0 0 24px;height:24px;color:var(--acc)}
.notice-copy{flex:1;min-width:0;white-space:nowrap}
.notice-close{flex:0 0 44px;height:44px;margin:-8px -8px -8px 0;border-radius:8px;display:grid;place-items:center;color:var(--sub)}
.touch{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(15,23,42,.16);border:1.5px solid rgba(15,23,42,.28);z-index:40;pointer-events:none}
.fade{position:absolute;inset:0;background:var(--bg);z-index:35;pointer-events:none}
</style></head>
<body>
<div class="stage"><div class="phone"><div class="screen">
  <div class="ui" id="ui">
    <div class="head"><h1>Distribució</h1>
      <div class="steps"><i class="on"></i><i class="on"></i><i class="cur"></i><i></i><b>3/4</b></div>
      <svg class="x" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></div>
    <div class="sel">Residència · 29–30 set.<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></div>
    <div class="part"><h2>Participants per ubicar</h2><span class="pill" id="pill">3 pendents</span></div>
    <div class="strip" id="strip">
      <div class="chip" id="c1" style="width:238px"><svg viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M6 21v-2a4 4 0 014-4h4a4 4 0 014 4v2"/></svg>Judit Prot<span class="ck"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 10-10"/></svg></span></div>
      <div class="chip" id="c2" style="width:200px"><svg viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M6 21v-2a4 4 0 014-4h4a4 4 0 014 4v2"/></svg>Jacob Thirsn</div>
      <div class="chip" id="c3" style="width:200px"><svg viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M6 21v-2a4 4 0 014-4h4a4 4 0 014 4v2"/></svg>Marta Vila</div>
    </div>
    <div class="map" id="map">
      <div class="dash" style="left:-22px;top:40px;width:120px;height:240px;background:#f1f5f9"></div>
            <div class="hatch" style="position:absolute;left:100px;top:72px;width:62px;height:96px"></div><div class="lbl" style="left:106px;top:114px;color:#8e9bab">Escala</div>
      <div class="dash" style="left:100px;top:168px;width:62px;height:190px"></div><div class="lbl" style="left:112px;top:262px;text-transform:none;font-size:11px;color:#64748b">Mario</div>
      <div class="rm" id="r3" style="left:218px;top:190px;width:62px;height:132px"></div>
      <div class="rm" id="r5" style="left:280px;top:190px;width:92px;height:132px;background:var(--taken)"></div>
      <div class="rm" style="left:372px;top:190px;width:100px;height:132px"></div>
      <div class="rm" style="left:162px;top:262px;width:56px;height:150px"></div>
      <div class="tag" id="t3" style="left:224px;top:226px;width:52px">lade3<b>3</b></div>
      <div class="tag" style="left:286px;top:226px;width:56px">Lade5<b>4</b></div>
      <div class="tag" style="left:384px;top:226px;width:56px">Lade6<b>6</b></div>
      <div class="tag" style="left:166px;top:306px;width:52px">Renoz<b>4</b></div>
      <div class="dash" style="left:-22px;top:410px;width:390px;height:0;border-width:1.5px 0 0"></div>
      <div class="zoom"><svg viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><svg viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg><svg viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"><path d="M4 8V6a2 2 0 012-2h2M4 16v2a2 2 0 002 2h2M16 4h2a2 2 0 012 2v2M16 20h2a2 2 0 002-2v-2"/></svg></div>
    </div>
    <div class="floor"><div class="f">‹ &nbsp;Planta tercera <small>Tota l'estada</small> &nbsp;›</div><div class="i"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 9h.01M11 12h1v4h1"/></svg></div></div>
    <div class="acts"><div class="btn b2">Enrere</div><div class="btn b1" id="go"><span id="g1">Tria una habitació</span><span id="g2" style="opacity:0">Assignar a lade3</span><span id="g3" style="opacity:0;display:flex;align-items:center;gap:8px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 10-10"/></svg>Assignada</span></div></div>
    <div class="notice" id="notice"><svg class="notice-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 12m-9 0a9 9 0 1 0 18 0a9 9 0 1 0 -18 0"/><path d="M9 12l2 2l4 -4"/></svg><span class="notice-copy">Judit Prot assignada a lade3</span><span class="notice-close"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6l-12 12"/><path d="M6 6l12 12"/></svg></span></div>
  </div>
  <div class="touch" id="touch"></div>
  <div class="fade" id="fade"></div>
</div></div></div>
<script>
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const io=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;          // easeInOutCubic
const out=x=>1-Math.pow(1-x,3);
// cubic-bezier(.2,.8,.2,1), la curva de entrada de los avisos de la app
const bez=x=>{if(x<=0||x>=1)return x;let lo=0,hi=1,u=.5;for(let k=0;k<30;k++){u=(lo+hi)/2;const bx=3*(1-u)*(1-u)*u*.2+3*(1-u)*u*u*.2+u*u*u;bx<x?lo=u:hi=u}return 3*(1-u)*(1-u)*u*.8+3*(1-u)*u*u+u*u*u};
const mix=(a,b,k)=>a+(b-a)*k;
const $=id=>document.getElementById(id);
// recorrido del dedo (coordenadas dentro de .screen, 394×800)
const P={start:[330,666],judit:[140,206],lade3:[271,471],go:[262,756],away:[372,790]};
const FOLD=2.9; // instante en que se confirma la asignación

function render(t){
  // fundido de entrada/salida para cerrar el bucle sin salto
  $('fade').style.opacity=t<.35?1-out(seg(t,0,.35)):seg(t,4.65,5);
  const picked=seg(t,.95,1.15), room=seg(t,1.95,2.15), done=io(seg(t,FOLD,FOLD+.45));
  // dedo
  let a,b,k;
  if(t<.9){a=P.start;b=P.judit;k=io(seg(t,.2,.9))}
  else if(t<1.8){a=P.judit;b=P.lade3;k=io(seg(t,1.25,1.8))}
  else if(t<2.8){a=P.lade3;b=P.go;k=io(seg(t,2.2,2.75))}
  else {a=P.go;b=P.away;k=io(seg(t,3.3,3.9))}
  const x=mix(a[0],b[0],k), y=mix(a[1],b[1],k);
  const press=Math.max(tapAt(t,.9),tapAt(t,1.8),tapAt(t,2.8));
  const tt=$('touch');tt.style.transform=`translate(${x}px,${y}px) scale(${1-.25*press})`;
  tt.style.opacity=t<.2?out(seg(t,.1,.3)):(t>3.7?1-seg(t,3.7,4.2):1);
  // chip Judit
  const c1=$('c1');
  c1.style.background=`rgb(${mix(255,205,picked)|0},${mix(255,226,picked)|0},${mix(255,215,picked)|0})`;
  c1.style.borderColor=picked>0?`rgb(${mix(203,47,picked)|0},${mix(213,122,picked)|0},${mix(225,90,picked)|0})`:'';
  c1.querySelector('.ck').style.opacity=picked*(1-done);
  // tras asignar: Judit sale y los demás se recolocan
  c1.style.opacity=1-done; c1.style.transform=`scale(${1-.06*done})`;
  const w1=238;
  $('c1').style.left=(0-0*done)+'px';
  $('c2').style.left=mix(w1+10,0,done)+'px';
  $('c3').style.left=mix(w1+10+200+10,210,done)+'px';
  $('pill').textContent=done>.5?'2 pendents':'3 pendents';
  // habitación lade3
  const r=$('r3'),t3=$('t3');
  r.style.borderColor=room>0?'#2f7a5a':'';
  r.style.borderWidth=mix(2,4,room)+'px';
  r.style.boxShadow=`0 0 ${18*room}px rgba(47,122,90,${.45*room})`;
  // al asignar, la habitación sigue con plazas libres: se tiñe más (ocupada en parte), no se llena del todo
  r.style.background=`rgb(${mix(233,160,done)|0},${mix(241,201,done)|0},${mix(236,178,done)|0})`;
  t3.style.background=`rgb(255,255,255)`;
  // el número son las plazas libres: baja de 3 a 2 con un pequeño latido, y la etiqueta sigue siendo la de la habitación
  const pop=1+.28*Math.sin(Math.PI*clamp((t-FOLD-.1)/.35));
  t3.innerHTML=`lade3<b style="transform:scale(${pop})">${t>=FOLD+.275?2:3}</b>`;
  // botón principal
  const go=$('go');
  const en=io(seg(t,2.0,2.25));
  go.style.background=`rgb(${mix(217,47,en)|0},${mix(225,122,en)|0},${mix(231,90,en)|0})`;
  go.style.color=`rgb(${mix(139,255,en)|0},${mix(153,255,en)|0},${mix(168,255,en)|0})`;
  go.style.transform=`scale(${1-.04*tapAt(t,2.8)})`;
  $('g1').style.opacity=1-en; $('g2').style.opacity=en*(1-done); $('g3').style.opacity=done;
  // aviso (como animateNotice de la app: entra 200 ms desde abajo, sale 140 ms bajando 20 px)
  const ta=$('notice'), t0=FOLD+.3, tin=bez(seg(t,t0,t0+.2)), tout=seg(t,4.3,4.44);
  ta.style.opacity=tin*(1-tout);
  ta.style.transform=tout>0?`translateY(${20*tout*tout}px)`:`translateY(calc(${(1-tin)*100}% + ${(1-tin)*12}px))`;
}
function tapAt(t,t0){const d=t-t0;return d<0||d>.3?0:Math.sin(Math.PI*d/.3)}
const q=new URLSearchParams(location.search);
window.__render=render;
render(parseFloat(q.get('t')||'0'));
if(!q.has('t')){const T0=performance.now();(function loop(){render(((performance.now()-T0)/1000)%5);requestAnimationFrame(loop)})()}
</script></body></html>
